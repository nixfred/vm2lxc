<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Where the data goes during a conversion"><title>Where the data goes during a conversion</title><defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6aa7ff"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#35d07f"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f2b84b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff5d6c"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fa0c8"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b58cff"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4fd1e8"/></marker><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#16224a"/></linearGradient><linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6aa7ff"/><stop offset="1" stop-color="#35d07f"/></linearGradient></defs><rect width="1280" height="640" fill="url(#bg)"/><text x="40" y="50" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="32" font-weight="800" fill="#dbe4ff" text-anchor="start" opacity="1">Where the data goes</text><text x="40" y="80" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="17" font-weight="500" fill="#8fa0c8" text-anchor="start" opacity="1">The source disk is only ever the ORIGIN of a snapshot. Everything that is written is written to new objects.</text><rect x="40" y="130" width="190" height="130" rx="12" fill="#121a30" stroke="#35d07f" stroke-width="2" opacity="1" /><text x="135.0" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="16" font-weight="800" fill="#35d07f" text-anchor="middle" opacity="1">VM disk</text><text x="135.0" y="184" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">LV vm-600-disk-0</text><text x="135.0" y="201" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">(or ZFS zvol)</text><text x="135.0" y="218" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">NEVER WRITTEN</text><g transform="translate(196,116) scale(0.95)"><rect x="0" y="9" width="22" height="16" rx="3" fill="#35d07f"/><path d="M4 9 V6 a7 7 0 0 1 14 0 V9" fill="none" stroke="#35d07f" stroke-width="3"/><circle cx="11" cy="17" r="2.2" fill="#0b1020"/></g><rect x="270" y="130" width="190" height="130" rx="12" fill="#121a30" stroke="#f2b84b" stroke-width="2" opacity="1" /><text x="365.0" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="16" font-weight="800" fill="#f2b84b" text-anchor="middle" opacity="1">snapshot</text><text x="365.0" y="184" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">thin LV, read-only</text><text x="365.0" y="201" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">tagged vm2lxc-&lt;run&gt;</text><text x="365.0" y="218" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">(or ZFS clone)</text><rect x="500" y="130" width="190" height="130" rx="12" fill="#121a30" stroke="#f2b84b" stroke-width="2" opacity="1" /><text x="595.0" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="16" font-weight="800" fill="#f2b84b" text-anchor="middle" opacity="1">loop device</text><text x="595.0" y="184" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">read-only, scans</text><text x="595.0" y="201" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">partitions</text><text x="595.0" y="218" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">/dev/loopNp1</text><rect x="730" y="130" width="230" height="130" rx="12" fill="#121a30" stroke="#f2b84b" stroke-width="2" opacity="1" /><text x="845.0" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="16" font-weight="800" fill="#f2b84b" text-anchor="middle" opacity="1">mounted read-only</text><text x="845.0" y="184" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">ext4: ro,noload,</text><text x="845.0" y="201" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">nodev,nosuid,noexec</text><text x="845.0" y="218" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">no journal replay</text><rect x="1000" y="130" width="240" height="130" rx="12" fill="#121a30" stroke="#6aa7ff" stroke-width="2" opacity="1" /><text x="1120.0" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="16" font-weight="800" fill="#6aa7ff" text-anchor="middle" opacity="1">staged archive</text><text x="1120.0" y="184" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">tar --numeric-owner</text><text x="1120.0" y="201" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">--xattrs --acls</text><text x="1120.0" y="218" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">/var/tmp/vm2lxc/&lt;run&gt;/</text><line x1="232" y1="195" x2="268" y2="195" stroke="#8fa0c8" stroke-width="3" marker-end="url(#a-dim)" stroke-linecap="round"/><line x1="462" y1="195" x2="498" y2="195" stroke="#8fa0c8" stroke-width="3" marker-end="url(#a-dim)" stroke-linecap="round"/><line x1="692" y1="195" x2="728" y2="195" stroke="#8fa0c8" stroke-width="3" marker-end="url(#a-dim)" stroke-linecap="round"/><line x1="962" y1="195" x2="998" y2="195" stroke="#8fa0c8" stroke-width="3" marker-end="url(#a-dim)" stroke-linecap="round"/><rect x="730" y="316" width="230" height="104" rx="12" fill="#0b1020" stroke="#b58cff" stroke-width="2" opacity="1" /><text x="845" y="346" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="16" font-weight="800" fill="#b58cff" text-anchor="middle" opacity="1">chroot-style reader</text><text x="845" y="370" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">the 12 guest checks read here:</text><text x="845" y="387" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">guest symlinks are re-rooted,</text><text x="845" y="404" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">no guest code ever runs</text><line x1="845" y1="262" x2="845" y2="314" stroke="#b58cff" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#a-purple)" stroke-linecap="round"/><text x="858" y="295" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="700" fill="#b58cff" text-anchor="start" opacity="1">read</text><line x1="1120" y1="262" x2="1120" y2="314" stroke="#6aa7ff" stroke-width="3" marker-end="url(#a-blue)" stroke-linecap="round"/><text x="1134" y="296" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#6aa7ff" text-anchor="start" opacity="1">pct create</text><rect x="1000" y="316" width="240" height="104" rx="12" fill="#121a30" stroke="#35d07f" stroke-width="2.2" opacity="1" /><text x="1120" y="346" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="16" font-weight="800" fill="#35d07f" text-anchor="middle" opacity="1">container rootfs</text><text x="1120" y="370" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">NEW volume, unprivileged</text><text x="1120" y="387" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">VM's exact MAC, tagged</text><text x="1120" y="404" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">fix-ups happen here only</text><rect x="40" y="470" width="190" height="110" rx="12" fill="#121a30" stroke="#35d07f" stroke-width="2" opacity="1" /><text x="135.0" y="500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="16" font-weight="800" fill="#35d07f" text-anchor="middle" opacity="1">extra disk</text><text x="135.0" y="524" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">LV vm-603-disk-1</text><text x="135.0" y="541" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">NEVER WRITTEN</text><g transform="translate(196,456) scale(0.95)"><rect x="0" y="9" width="22" height="16" rx="3" fill="#35d07f"/><path d="M4 9 V6 a7 7 0 0 1 14 0 V9" fill="none" stroke="#35d07f" stroke-width="3"/><circle cx="11" cy="17" r="2.2" fill="#0b1020"/></g><text x="620" y="512" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14" font-weight="600" fill="#8fa0c8" text-anchor="middle" opacity="1">same path: snapshot → loop → read-only mount → archive</text><path d="M 232 525 L 996 525" fill="none" stroke="#8fa0c8" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#a-dim)" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1120 422 L 1120 466" fill="none" stroke="#35d07f" stroke-width="3" marker-end="url(#a-green)" stroke-linecap="round" stroke-linejoin="round"/><rect x="1000" y="470" width="240" height="110" rx="12" fill="#121a30" stroke="#35d07f" stroke-width="2.2" opacity="1" /><text x="1120" y="502" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="16" font-weight="800" fill="#35d07f" text-anchor="middle" opacity="1">mp0 volume</text><text x="1120" y="526" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">at the path the guest's fstab</text><text x="1120" y="543" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">gives it (e.g. /home)</text><text x="40" y="616" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14" font-weight="500" fill="#8fa0c8" text-anchor="start" opacity="1">Extra-disk data is only written into a VERIFIED mount point: it can never be poured into the root filesystem by mistake.</text></svg>
