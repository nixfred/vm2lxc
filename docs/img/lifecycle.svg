<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Lifecycle of a conversion: success, failure, crash and undo"><title>Lifecycle of a conversion: success, failure, crash and undo</title><defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6aa7ff"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#35d07f"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f2b84b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff5d6c"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fa0c8"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b58cff"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4fd1e8"/></marker><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#16224a"/></linearGradient><linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6aa7ff"/><stop offset="1" stop-color="#35d07f"/></linearGradient></defs><rect width="1280" height="640" fill="url(#bg)"/><text x="40" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="32" font-weight="800" fill="#dbe4ff" text-anchor="start" opacity="1">What happens to your VM, in every outcome</text><text x="40" y="82" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="17" font-weight="500" fill="#8fa0c8" text-anchor="start" opacity="1">Whatever goes wrong, you end up with a running VM and nothing left behind.</text><rect x="40" y="120" width="220" height="96" rx="14" fill="#121a30" stroke="#35d07f" stroke-width="2.2" opacity="1" /><text x="150.0" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="17" font-weight="800" fill="#35d07f" text-anchor="middle" opacity="1">VM running</text><text x="150.0" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">the starting point</text><text x="150.0" y="192" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">(or already stopped)</text><rect x="330" y="120" width="240" height="96" rx="14" fill="#121a30" stroke="#f2b84b" stroke-width="2.2" opacity="1" /><text x="450.0" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="17" font-weight="800" fill="#f2b84b" text-anchor="middle" opacity="1">VM stopped</text><text x="450.0" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">+ read-only snapshot</text><text x="450.0" y="192" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">mounted, journal open</text><rect x="640" y="120" width="250" height="96" rx="14" fill="#121a30" stroke="#6aa7ff" stroke-width="2.2" opacity="1" /><text x="765.0" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="17" font-weight="800" fill="#6aa7ff" text-anchor="middle" opacity="1">container built</text><text x="765.0" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">stopped · VM stopped</text><text x="765.0" y="192" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">journal COMMITTED</text><rect x="960" y="120" width="280" height="96" rx="14" fill="#121a30" stroke="#35d07f" stroke-width="2.2" opacity="1" /><text x="1100.0" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="17" font-weight="800" fill="#35d07f" text-anchor="middle" opacity="1">container RUNNING</text><text x="1100.0" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">the cutover (--start)</text><text x="1100.0" y="192" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">VM stays stopped</text><line x1="262" y1="168" x2="328" y2="168" stroke="#8fa0c8" stroke-width="3" marker-end="url(#a-dim)" stroke-linecap="round"/><text x="295.0" y="154" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="700" fill="#8fa0c8" text-anchor="middle" opacity="1">convert</text><text x="295.0" y="192" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="700" fill="#8fa0c8" text-anchor="middle" opacity="1">--yes</text><line x1="572" y1="168" x2="638" y2="168" stroke="#8fa0c8" stroke-width="3" marker-end="url(#a-dim)" stroke-linecap="round"/><text x="605.0" y="154" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="700" fill="#8fa0c8" text-anchor="middle" opacity="1">copy +</text><text x="605.0" y="192" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="700" fill="#8fa0c8" text-anchor="middle" opacity="1">create</text><line x1="892" y1="168" x2="958" y2="168" stroke="#8fa0c8" stroke-width="3" marker-end="url(#a-dim)" stroke-linecap="round"/><text x="925.0" y="154" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="700" fill="#8fa0c8" text-anchor="middle" opacity="1">pct start</text><rect x="40" y="330" width="380" height="118" rx="14" fill="#121a30" stroke="#ff5d6c" stroke-width="2.2" opacity="1" /><text x="230.0" y="360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="17" font-weight="800" fill="#ff5d6c" text-anchor="middle" opacity="1">ANY failure, Ctrl-C, SIGTERM</text><text x="230.0" y="384" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">or a dropped ssh session: automatic rollback.</text><text x="230.0" y="402" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">The half-built container is destroyed,</text><text x="230.0" y="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">the snapshot removed, the VM started again.</text><rect x="440" y="330" width="380" height="118" rx="14" fill="#121a30" stroke="#b58cff" stroke-width="2.2" opacity="1" /><text x="630.0" y="360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="17" font-weight="800" fill="#b58cff" text-anchor="middle" opacity="1">SIGKILL or power cut</text><text x="630.0" y="384" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">The journal stays open; nothing is forgotten.</text><text x="630.0" y="402" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">vm2lxc cleanup --yes destroys exactly what</text><text x="630.0" y="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">the journal names, then restarts the VM.</text><rect x="840" y="330" width="400" height="118" rx="14" fill="#121a30" stroke="#f2b84b" stroke-width="2.2" opacity="1" /><text x="1040.0" y="360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="17" font-weight="800" fill="#f2b84b" text-anchor="middle" opacity="1">vm2lxc undo --yes</text><text x="1040.0" y="384" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">Stops and destroys the container (only if it</text><text x="1040.0" y="402" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">carries this run's tag), restores onboot and</text><text x="1040.0" y="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="middle" opacity="1">starts the VM. Never while the container runs.</text><path d="M 450 218 C 450 270, 230 270, 230 328" fill="none" stroke="#ff5d6c" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a-red)" stroke-linecap="round" stroke-linejoin="round"/><path d="M 740 218 C 740 270, 630 270, 630 328" fill="none" stroke="#b58cff" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a-purple)" stroke-linecap="round" stroke-linejoin="round"/><path d="M 800 218 C 800 270, 960 270, 960 328" fill="none" stroke="#f2b84b" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a-amber)" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1100 218 C 1100 270, 1100 290, 1100 328" fill="none" stroke="#f2b84b" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a-amber)" stroke-linecap="round" stroke-linejoin="round"/><rect x="284.0" y="246" width="112" height="24" rx="6" fill="#0f1730" opacity="1" /><text x="340" y="263" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="700" fill="#ff5d6c" text-anchor="middle" opacity="1">during the run</text><rect x="634.0" y="246" width="112" height="24" rx="6" fill="#0f1730" opacity="1" /><text x="690" y="263" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="700" fill="#b58cff" text-anchor="middle" opacity="1">during the run</text><rect x="912.0" y="246" width="176" height="24" rx="6" fill="#0f1730" opacity="1" /><text x="1000" y="263" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="700" fill="#f2b84b" text-anchor="middle" opacity="1">after: changed your mind</text><rect x="40" y="520" width="1200" height="74" rx="14" fill="#0b1020" stroke="#35d07f" stroke-width="2.5" opacity="1" /><text x="640" y="552" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="21" font-weight="800" fill="#35d07f" text-anchor="middle" opacity="1">VM running again, and nothing of ours is left behind</text><text x="640" y="578" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14" font-weight="500" fill="#dbe4ff" text-anchor="middle" opacity="1">no container (unless you kept it), snapshot, loop device, mount, staged file or open journal</text><line x1="230" y1="450" x2="230" y2="516" stroke="#35d07f" stroke-width="3" marker-end="url(#a-green)" stroke-linecap="round"/><line x1="630" y1="450" x2="630" y2="516" stroke="#35d07f" stroke-width="3" marker-end="url(#a-green)" stroke-linecap="round"/><line x1="1040" y1="450" x2="1040" y2="516" stroke="#35d07f" stroke-width="3" marker-end="url(#a-green)" stroke-linecap="round"/><text x="40" y="626" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14" font-weight="500" fill="#8fa0c8" text-anchor="start" opacity="1">Solid arrows: the happy path. Dashed: the three recovery routes. All three end in the same place.</text></svg>
