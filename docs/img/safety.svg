<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-label="The safety layers around your VM"><title>The safety layers around your VM</title><defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6aa7ff"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#35d07f"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f2b84b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff5d6c"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fa0c8"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b58cff"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4fd1e8"/></marker><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#16224a"/></linearGradient><linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6aa7ff"/><stop offset="1" stop-color="#35d07f"/></linearGradient></defs><rect width="1280" height="800" fill="url(#bg)"/><text x="40" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="32" font-weight="800" fill="#dbe4ff" text-anchor="start" opacity="1">Eight layers between the tool and your VM</text><text x="40" y="82" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="17" font-weight="500" fill="#8fa0c8" text-anchor="start" opacity="1">Every layer is enforced in code and has a test that fails when the layer is removed.</text><rect x="40.0" y="180.0" width="600" height="436.8" rx="18" fill="#18223f" stroke="#b58cff" stroke-width="2.2" opacity="0.97" /><circle cx="62.0" cy="200.0" r="13" fill="#b58cff"/><text x="62.0" y="206.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" font-weight="800" fill="#0b1020" text-anchor="middle" opacity="1">8</text><text x="84.0" y="205.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="800" fill="#b58cff" text-anchor="start" opacity="1">fixed trust anchors</text><rect x="70.0" y="210.0" width="540" height="390.0" rx="18" fill="#121a30" stroke="#4fd1e8" stroke-width="2.2" opacity="0.97" /><circle cx="92.0" cy="230.0" r="13" fill="#4fd1e8"/><text x="92.0" y="236.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" font-weight="800" fill="#0b1020" text-anchor="middle" opacity="1">7</text><text x="114.0" y="235.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="800" fill="#4fd1e8" text-anchor="start" opacity="1">signal-proof teardown</text><rect x="100.0" y="240.0" width="480" height="343.2" rx="18" fill="#18223f" stroke="#f2b84b" stroke-width="2.2" opacity="0.97" /><circle cx="122.0" cy="260.0" r="13" fill="#f2b84b"/><text x="122.0" y="266.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" font-weight="800" fill="#0b1020" text-anchor="middle" opacity="1">6</text><text x="144.0" y="265.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="800" fill="#f2b84b" text-anchor="start" opacity="1">write-ahead journal</text><rect x="130.0" y="270.0" width="420" height="296.40000000000003" rx="18" fill="#121a30" stroke="#6aa7ff" stroke-width="2.2" opacity="0.97" /><circle cx="152.0" cy="290.0" r="13" fill="#6aa7ff"/><text x="152.0" y="296.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" font-weight="800" fill="#0b1020" text-anchor="middle" opacity="1">5</text><text x="174.0" y="295.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="800" fill="#6aa7ff" text-anchor="start" opacity="1">identity re-checks</text><rect x="160.0" y="300.0" width="360" height="249.60000000000002" rx="18" fill="#18223f" stroke="#b58cff" stroke-width="2.2" opacity="0.97" /><circle cx="182.0" cy="320.0" r="13" fill="#b58cff"/><text x="182.0" y="326.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" font-weight="800" fill="#0b1020" text-anchor="middle" opacity="1">4</text><text x="204.0" y="325.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="800" fill="#b58cff" text-anchor="start" opacity="1">chroot-style guest reader</text><rect x="190.0" y="330.0" width="300" height="202.8" rx="18" fill="#121a30" stroke="#ff5d6c" stroke-width="2.2" opacity="0.97" /><circle cx="212.0" cy="350.0" r="13" fill="#ff5d6c"/><text x="212.0" y="356.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" font-weight="800" fill="#0b1020" text-anchor="middle" opacity="1">3</text><text x="234.0" y="355.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="800" fill="#ff5d6c" text-anchor="start" opacity="1">the allowlist door</text><rect x="220.0" y="360.0" width="240" height="156.0" rx="18" fill="#18223f" stroke="#4fd1e8" stroke-width="2.2" opacity="0.97" /><circle cx="242.0" cy="380.0" r="13" fill="#4fd1e8"/><text x="242.0" y="386.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" font-weight="800" fill="#0b1020" text-anchor="middle" opacity="1">2</text><text x="264.0" y="385.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="800" fill="#4fd1e8" text-anchor="start" opacity="1">plan only by default</text><rect x="250" y="400" width="180" height="104" rx="14" fill="#0b1020" stroke="#35d07f" stroke-width="3" opacity="1" /><circle cx="278" cy="426" r="13" fill="#35d07f"/><text x="278" y="432" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" font-weight="800" fill="#0b1020" text-anchor="middle" opacity="1">1</text><text x="340" y="452" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="20" font-weight="800" fill="#35d07f" text-anchor="middle" opacity="1">YOUR VM</text><text x="340" y="476" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14" font-weight="600" fill="#dbe4ff" text-anchor="middle" opacity="1">never written</text><text x="340" y="494" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14" font-weight="600" fill="#dbe4ff" text-anchor="middle" opacity="1">never deleted</text><circle cx="720" cy="138" r="13" fill="#b58cff"/><text x="720" y="144" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" font-weight="800" fill="#0b1020" text-anchor="middle" opacity="1">8</text><text x="746" y="144" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="17" font-weight="800" fill="#b58cff" text-anchor="start" opacity="1">Fixed trust anchors</text><text x="746" y="166" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">tools must resolve to a system dir; run root is always /run/vm2lxc;</text><text x="746" y="184" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">mount options must be EXACTLY the read-only set</text><circle cx="720" cy="221" r="13" fill="#4fd1e8"/><text x="720" y="227" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" font-weight="800" fill="#0b1020" text-anchor="middle" opacity="1">7</text><text x="746" y="227" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="17" font-weight="800" fill="#4fd1e8" text-anchor="start" opacity="1">Signal-proof teardown</text><text x="746" y="249" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">INT, TERM, HUP, PIPE tear down and are ignored while tearing down;</text><text x="746" y="267" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">SIGKILL is recovered by cleanup</text><circle cx="720" cy="304" r="13" fill="#f2b84b"/><text x="720" y="310" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" font-weight="800" fill="#0b1020" text-anchor="middle" opacity="1">6</text><text x="746" y="310" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="17" font-weight="800" fill="#f2b84b" text-anchor="start" opacity="1">Write-ahead journal</text><text x="746" y="332" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">a step is on disk as PENDING before it runs; a step that cannot be</text><text x="746" y="350" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">recorded is not performed</text><circle cx="720" cy="387" r="13" fill="#6aa7ff"/><text x="720" y="393" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" font-weight="800" fill="#0b1020" text-anchor="middle" opacity="1">5</text><text x="746" y="393" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="17" font-weight="800" fill="#6aa7ff" text-anchor="start" opacity="1">Identity re-checks</text><text x="746" y="415" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">ZFS stamp / LVM tag / container run-tag verified before ANY destroy;</text><text x="746" y="433" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">a pre-existing object is never adopted</text><circle cx="720" cy="470" r="13" fill="#b58cff"/><text x="720" y="476" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" font-weight="800" fill="#0b1020" text-anchor="middle" opacity="1">4</text><text x="746" y="476" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="17" font-weight="800" fill="#b58cff" text-anchor="start" opacity="1">Chroot-style guest reader</text><text x="746" y="498" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">an absolute symlink in the guest is re-rooted under the guest;</text><text x="746" y="516" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">fix-ups use host tools only</text><circle cx="720" cy="553" r="13" fill="#ff5d6c"/><text x="720" y="559" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" font-weight="800" fill="#0b1020" text-anchor="middle" opacity="1">3</text><text x="746" y="559" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="17" font-weight="800" fill="#ff5d6c" text-anchor="start" opacity="1">The allowlist door</text><text x="746" y="581" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">one function, exact argument shapes; qm and pct limited to this</text><text x="746" y="599" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">run's VM and container</text><circle cx="720" cy="636" r="13" fill="#4fd1e8"/><text x="720" y="642" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" font-weight="800" fill="#0b1020" text-anchor="middle" opacity="1">2</text><text x="746" y="642" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="17" font-weight="800" fill="#4fd1e8" text-anchor="start" opacity="1">Plan only by default</text><text x="746" y="664" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">nothing executes without --yes; fixture mode can never execute;</text><text x="746" y="682" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">--dry-run beats --yes</text><circle cx="720" cy="719" r="13" fill="#35d07f"/><text x="720" y="725" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" font-weight="800" fill="#0b1020" text-anchor="middle" opacity="1">1</text><text x="746" y="725" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="17" font-weight="800" fill="#35d07f" text-anchor="start" opacity="1">Your VM</text><text x="746" y="747" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">shut down gracefully, autostart off; undo starts it again. Its disks</text><text x="746" y="765" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">were sha256-checked before and after</text></svg>
