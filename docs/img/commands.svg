<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-label="The six commands"><title>The six commands</title><defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6aa7ff"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#35d07f"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f2b84b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff5d6c"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fa0c8"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b58cff"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4fd1e8"/></marker><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#16224a"/></linearGradient><linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6aa7ff"/><stop offset="1" stop-color="#35d07f"/></linearGradient></defs><rect width="1280" height="660" fill="url(#bg)"/><text x="40" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="32" font-weight="800" fill="#dbe4ff" text-anchor="start" opacity="1">Six commands, two of them read-only</text><text x="40" y="82" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="17" font-weight="500" fill="#8fa0c8" text-anchor="start" opacity="1">Everything that changes anything shows its plan first and does nothing until you add --yes.</text><rect x="40" y="118" width="386" height="160" rx="14" fill="#121a30" stroke="#6aa7ff" stroke-width="2" opacity="1" /><rect x="40" y="118" width="386" height="6" rx="3" fill="#6aa7ff" opacity="1" /><text x="60" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" font-weight="800" fill="#6aa7ff" text-anchor="start" opacity="1">preflight</text><rect x="288" y="142" width="118" height="24" rx="12.0" fill="#6aa7ff" fill-opacity="0.16" stroke="#6aa7ff" stroke-width="1.4"/><text x="347.0" y="158.32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="12" font-weight="700" fill="#6aa7ff" text-anchor="middle" opacity="1">read-only</text><text x="60" y="202" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">Should this VM be converted?</text><text x="60" y="226" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">Verdict, disk + NIC plan, and RAM/CPU</text><text x="60" y="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">sizing from the VM's own RRD history.</text><rect x="447" y="118" width="386" height="160" rx="14" fill="#121a30" stroke="#6aa7ff" stroke-width="2" opacity="1" /><rect x="447" y="118" width="386" height="6" rx="3" fill="#6aa7ff" opacity="1" /><text x="467" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" font-weight="800" fill="#6aa7ff" text-anchor="start" opacity="1">scan</text><rect x="695" y="142" width="118" height="24" rx="12.0" fill="#6aa7ff" fill-opacity="0.16" stroke="#6aa7ff" stroke-width="1.4"/><text x="754.0" y="158.32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="12" font-weight="700" fill="#6aa7ff" text-anchor="middle" opacity="1">read-only</text><text x="467" y="202" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">Which VMs are worth converting?</text><text x="467" y="226" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">Ranks them by verdict, then by the</text><text x="467" y="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">RAM you would save. Name the VMs.</text><rect x="854" y="118" width="386" height="160" rx="14" fill="#121a30" stroke="#f2b84b" stroke-width="2" opacity="1" /><rect x="854" y="118" width="386" height="6" rx="3" fill="#f2b84b" opacity="1" /><text x="874" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" font-weight="800" fill="#f2b84b" text-anchor="start" opacity="1">inspect</text><rect x="1102" y="142" width="118" height="24" rx="12.0" fill="#f2b84b" fill-opacity="0.16" stroke="#f2b84b" stroke-width="1.4"/><text x="1161.0" y="158.32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="12" font-weight="700" fill="#f2b84b" text-anchor="middle" opacity="1">--yes to run</text><text x="874" y="202" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">Look inside, change nothing: snapshot,</text><text x="874" y="226" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">mount read-only, run the 12 checks,</text><text x="874" y="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">then tear it all down again.</text><rect x="40" y="298" width="386" height="160" rx="14" fill="#121a30" stroke="#35d07f" stroke-width="2" opacity="1" /><rect x="40" y="298" width="386" height="6" rx="3" fill="#35d07f" opacity="1" /><text x="60" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" font-weight="800" fill="#35d07f" text-anchor="start" opacity="1">convert</text><rect x="288" y="322" width="118" height="24" rx="12.0" fill="#35d07f" fill-opacity="0.16" stroke="#35d07f" stroke-width="1.4"/><text x="347.0" y="338.32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="12" font-weight="700" fill="#35d07f" text-anchor="middle" opacity="1">--yes to run</text><text x="60" y="382" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">Build a NEW container from the VM.</text><text x="60" y="406" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">Stop-and-copy, journaled, and it</text><text x="60" y="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">rolls back on any error.</text><rect x="447" y="298" width="386" height="160" rx="14" fill="#121a30" stroke="#f2b84b" stroke-width="2" opacity="1" /><rect x="447" y="298" width="386" height="6" rx="3" fill="#f2b84b" opacity="1" /><text x="467" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" font-weight="800" fill="#f2b84b" text-anchor="start" opacity="1">undo</text><rect x="695" y="322" width="118" height="24" rx="12.0" fill="#f2b84b" fill-opacity="0.16" stroke="#f2b84b" stroke-width="1.4"/><text x="754.0" y="338.32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="12" font-weight="700" fill="#f2b84b" text-anchor="middle" opacity="1">--yes to run</text><text x="467" y="382" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">Reverse a conversion: destroy the</text><text x="467" y="406" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">container, start the VM again.</text><text x="467" y="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">Never while the container runs.</text><rect x="854" y="298" width="386" height="160" rx="14" fill="#121a30" stroke="#b58cff" stroke-width="2" opacity="1" /><rect x="854" y="298" width="386" height="6" rx="3" fill="#b58cff" opacity="1" /><text x="874" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" font-weight="800" fill="#b58cff" text-anchor="start" opacity="1">cleanup</text><rect x="1102" y="322" width="118" height="24" rx="12.0" fill="#b58cff" fill-opacity="0.16" stroke="#b58cff" stroke-width="1.4"/><text x="1161.0" y="338.32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="12" font-weight="700" fill="#b58cff" text-anchor="middle" opacity="1">--yes to run</text><text x="874" y="382" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">After a crash: removes exactly what</text><text x="874" y="406" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">the journals name, after verifying</text><text x="874" y="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">that each object is ours.</text><rect x="40" y="488" width="1200" height="140" rx="12" fill="#0b1020" stroke="#26325a" stroke-width="1.4" opacity="1" /><text x="60" y="524" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="700" fill="#35d07f" text-anchor="start" opacity="1">$ vm2lxc convert 600 --ctid 610 --yes --start</text><text x="60" y="554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="700" fill="#f2b84b" text-anchor="start" opacity="1">$ vm2lxc undo 610 --yes</text><text x="60" y="596" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" font-weight="500" fill="#8fa0c8" text-anchor="start" opacity="1">options: --ctid N  --start  --privileged  --memory MB  --cores N  --hostname NAME  --node NAME  --dry-run</text></svg>
