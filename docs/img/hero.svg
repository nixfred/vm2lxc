y="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="104" font-weight="800" fill="url(#ttl)">vm2lxc</text><text x="68" y="215" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="30" font-weight="500" fill="#dbe4ff" text-anchor="start" opacity="1">Turn a Proxmox VM into an LXC container.</text><text x="68" y="258" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="30" font-weight="800" fill="#35d07f" text-anchor="start" opacity="1">And never touch the VM.</text><rect x="68" y="352" width="225.5" height="32" rx="16.0" fill="#6aa7ff" fill-opacity="0.16" stroke="#6aa7ff" stroke-width="1.4"/><text x="180.75" y="373.4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" font-weight="700" fill="#6aa7ff" text-anchor="middle" opacity="1">read-only snapshots</text><rect x="305.5" y="352" width="225.5" height="32" rx="16.0" fill="#f2b84b" fill-opacity="0.16" stroke="#f2b84b" stroke-width="1.4"/><text x="418.25" y="373.4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" font-weight="700" fill="#f2b84b" text-anchor="middle" opacity="1">write-ahead journal</text><rect x="543.0" y="352" width="194.0" height="32" rx="16.0" fill="#35d07f" fill-opacity="0.16" stroke="#35d07f" stroke-width="1.4"/><text x="640.0" y="373.4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" font-weight="700" fill="#35d07f" text-anchor="middle" opacity="1">one-command undo</text><rect x="749.0" y="352" width="204.5" height="32" rx="16.0" fill="#b58cff" fill-opacity="0.16" stroke="#b58cff" stroke-width="1.4"/><text x="851.25" y="373.4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" font-weight="700" fill="#b58cff" text-anchor="middle" opacity="1">plain bash, no AI</text><text x="6