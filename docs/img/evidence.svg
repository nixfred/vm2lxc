<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-label="Proven on real hardware"><title>Proven on real hardware</title><defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6aa7ff"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#35d07f"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f2b84b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff5d6c"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fa0c8"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b58cff"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4fd1e8"/></marker><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#16224a"/></linearGradient><linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6aa7ff"/><stop offset="1" stop-color="#35d07f"/></linearGradient></defs><rect width="1280" height="700" fill="url(#bg)"/><text x="40" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="32" font-weight="800" fill="#dbe4ff" text-anchor="start" opacity="1">Proven on a real Proxmox host</text><text x="40" y="82" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="16" font-weight="500" fill="#8fa0c8" text-anchor="start" opacity="1">PVE 9.2.28 · LVM-thin · four disposable test VMs · each converted and undone · host back to baseline after every run</text><rect x="40" y="112" width="285" height="322" rx="14" fill="#121a30" stroke="#35d07f" stroke-width="2" opacity="1" /><rect x="40" y="112" width="285" height="66" rx="14" fill="#35d07f" opacity="0.18" /><text x="58" y="142" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="20" font-weight="800" fill="#35d07f" text-anchor="start" opacity="1">Debian 12</text><text x="58" y="165" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14" font-weight="500" fill="#dbe4ff" text-anchor="start" opacity="1">cloud image, netplan</text><circle cx="295" cy="146" r="12" fill="#35d07f"/><path d="M289 146 l4.5 4.5 l8.5 -10" fill="none" stroke="#0b1020" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="216" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">14–20 s end to end</text><text x="58" y="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">source disk sha256: IDENTICAL</text><text x="58" y="284" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">booted: running, 0 failed units</text><text x="58" y="318" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">eth0 UP, DHCP, gateway 0% loss</text><text x="58" y="352" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">undo: VM running again</text><rect x="345" y="112" width="285" height="322" rx="14" fill="#121a30" stroke="#35d07f" stroke-width="2" opacity="1" /><rect x="345" y="112" width="285" height="66" rx="14" fill="#35d07f" opacity="0.18" /><text x="363" y="142" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="20" font-weight="800" fill="#35d07f" text-anchor="start" opacity="1">Debian 12</text><text x="363" y="165" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14" font-weight="500" fill="#dbe4ff" text-anchor="start" opacity="1">two disks</text><circle cx="600" cy="146" r="12" fill="#35d07f"/><path d="M594 146 l4.5 4.5 l8.5 -10" fill="none" stroke="#0b1020" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="363" y="216" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">disk 2 → mp0 at /home</text><text x="363" y="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">(path read from the fstab)</text><text x="363" y="284" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">4 of 4 files sha256-IDENTICAL</text><text x="363" y="318" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">booted, 0 failed units</text><text x="363" y="352" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">network up, undo clean</text><rect x="650" y="112" width="285" height="322" rx="14" fill="#121a30" stroke="#35d07f" stroke-width="2" opacity="1" /><rect x="650" y="112" width="285" height="66" rx="14" fill="#35d07f" opacity="0.18" /><text x="668" y="142" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="20" font-weight="800" fill="#35d07f" text-anchor="start" opacity="1">Alpine 3.24</text><text x="668" y="165" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14" font-weight="500" fill="#dbe4ff" text-anchor="start" opacity="1">OpenRC, no systemd</text><circle cx="905" cy="146" r="12" fill="#35d07f"/><path d="M899 146 l4.5 4.5 l8.5 -10" fill="none" stroke="#0b1020" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="668" y="216" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">133 MiB archive</text><text x="668" y="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">booted: services started</text><text x="668" y="284" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">DHCP address, gateway ok</text><text x="668" y="318" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">LABEL= fstab lines commented</text><text x="668" y="352" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">undo: VM running again</text><rect x="955" y="112" width="285" height="322" rx="14" fill="#121a30" stroke="#f2b84b" stroke-width="2" opacity="1" /><rect x="955" y="112" width="285" height="66" rx="14" fill="#f2b84b" opacity="0.18" /><text x="973" y="142" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="20" font-weight="800" fill="#f2b84b" text-anchor="start" opacity="1">Ubuntu 24.04</text><text x="973" y="165" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14" font-weight="500" fill="#dbe4ff" text-anchor="start" opacity="1">with Tailscale</text><circle cx="1210" cy="146" r="12" fill="#f2b84b"/><path d="M1204 146 l4.5 4.5 l8.5 -10" fill="none" stroke="#0b1020" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="973" y="216" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">converted, NOT started:</text><text x="973" y="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">one node, never two copies</text><text x="973" y="284" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">/boot partition skipped</text><text x="973" y="318" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">netplan fixed, state copied</text><text x="973" y="352" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">undo: VM running again</text><rect x="40" y="458" width="1200" height="206" rx="14" fill="#121a30" stroke="#ff5d6c" stroke-width="1.8" opacity="1" /><text x="60" y="492" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="19" font-weight="800" fill="#ff5d6c" text-anchor="start" opacity="1">Three bugs ONLY the real host could show (all fixed, each with a regression test)</text><circle cx="76" cy="525" r="13" fill="#ff5d6c"/><text x="76" y="530" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" font-weight="800" fill="#0b1020" text-anchor="middle" opacity="1">1</text><text x="104" y="530" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="16" font-weight="800" fill="#dbe4ff" text-anchor="start" opacity="1">eth0 stayed DOWN</text><text x="360" y="530" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" font-weight="500" fill="#8fa0c8" text-anchor="start" opacity="1">cloud-init's netplan matches the NIC by permanent MAC; a veth has none.</text><circle cx="76" cy="567" r="13" fill="#ff5d6c"/><text x="76" y="572" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" font-weight="800" fill="#0b1020" text-anchor="middle" opacity="1">2</text><text x="104" y="572" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="16" font-weight="800" fill="#dbe4ff" text-anchor="start" opacity="1">copying disk 2 failed</text><text x="360" y="572" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" font-weight="500" fill="#8fa0c8" text-anchor="start" opacity="1">the new volume's own lost+found is owned by real root (and it rolled back perfectly).</text><circle cx="76" cy="609" r="13" fill="#ff5d6c"/><text x="76" y="614" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" font-weight="800" fill="#0b1020" text-anchor="middle" opacity="1">3</text><text x="104" y="614" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="16" font-weight="800" fill="#dbe4ff" text-anchor="start" opacity="1">Ubuntu refused as 'iSCSI'</text><text x="360" y="614" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="15" font-weight="500" fill="#8fa0c8" text-anchor="start" opacity="1">the cloud image ships the packages and a stock multipath.conf: installed is not in use.</text><text x="40" y="690" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14.5" font-weight="500" fill="#8fa0c8" text-anchor="start" opacity="1">ZFS is implemented and tested against a fake only: never run on real hardware. Only one real host so far.</text></svg>
