<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-label="The vm2lxc conversion pipeline, start to finish"><title>The vm2lxc conversion pipeline, start to finish</title><defs><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6aa7ff"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#35d07f"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f2b84b"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff5d6c"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fa0c8"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b58cff"/></marker><marker id="a-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4fd1e8"/></marker><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#16224a"/></linearGradient><linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6aa7ff"/><stop offset="1" stop-color="#35d07f"/></linearGradient></defs><rect width="1280" height="860" fill="url(#bg)"/><text x="40" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="32" font-weight="800" fill="#dbe4ff" text-anchor="start" opacity="1">One conversion, start to finish</text><text x="40" y="82" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="17" font-weight="500" fill="#8fa0c8" text-anchor="start" opacity="1">vm2lxc convert &lt;vmid&gt; --yes   ·   every step is written to a journal BEFORE it runs</text><rect x="40" y="110" width="1200" height="96" rx="14" fill="#121a30" stroke="#6aa7ff" stroke-width="1.8" opacity="1" /><rect x="40" y="110" width="200" height="96" rx="14" fill="#6aa7ff" opacity="0.2" /><text x="60" y="144" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="21" font-weight="800" fill="#6aa7ff" text-anchor="start" opacity="1">PLAN</text><text x="60" y="170" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#8fa0c8" text-anchor="start" opacity="1">read-only</text><text x="264" y="144" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">Verdict (green / yellow / red), container id, hostname, RAM and cores from the VM,</text><text x="264" y="168" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">the VM's exact MAC and bridge, every step. Nothing runs until you add --yes.</text><text x="264" y="192" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#8fa0c8" text-anchor="start" opacity="1">preflight / scan show the same verdict plus sizing from the VM's own RRD history.</text><rect x="40" y="224" width="1200" height="136" rx="14" fill="#121a30" stroke="#f2b84b" stroke-width="1.8" opacity="1" /><rect x="40" y="224" width="200" height="136" rx="14" fill="#f2b84b" opacity="0.2" /><text x="60" y="258" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="21" font-weight="800" fill="#f2b84b" text-anchor="start" opacity="1">PHASE A</text><text x="60" y="284" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#8fa0c8" text-anchor="start" opacity="1">stop and snapshot</text><text x="60" y="303" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#8fa0c8" text-anchor="start" opacity="1">(same engine as inspect)</text><rect x="256" y="240" width="232" height="104" rx="10" fill="#0b1020" stroke="#f2b84b" stroke-width="1.6" opacity="1" /><text x="268" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15.5" font-weight="800" fill="#f2b84b" text-anchor="start" opacity="1">vm-stop</text><text x="268" y="288" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">graceful shutdown</text><text x="268" y="305" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">(stop-and-copy): the</text><text x="268" y="322" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">snapshot is consistent</text><rect x="498" y="240" width="232" height="104" rx="10" fill="#0b1020" stroke="#f2b84b" stroke-width="1.6" opacity="1" /><text x="510" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15.5" font-weight="800" fill="#f2b84b" text-anchor="start" opacity="1">vm-onboot</text><text x="510" y="288" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">autostart off, so the</text><text x="510" y="305" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">VM never boots beside</text><text x="510" y="322" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">its container</text><rect x="740" y="240" width="232" height="104" rx="10" fill="#0b1020" stroke="#f2b84b" stroke-width="1.6" opacity="1" /><text x="752" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15.5" font-weight="800" fill="#f2b84b" text-anchor="start" opacity="1">snapshot</text><text x="752" y="288" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">storage-level, read-only</text><text x="752" y="305" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">thin LV or ZFS: the</text><text x="752" y="322" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">source is only an origin</text><rect x="982" y="240" width="232" height="104" rx="10" fill="#0b1020" stroke="#f2b84b" stroke-width="1.6" opacity="1" /><text x="994" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15.5" font-weight="800" fill="#f2b84b" text-anchor="start" opacity="1">mount (ro)</text><text x="994" y="288" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">loop device, ext4</text><text x="994" y="305" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">ro,noload,nodev,</text><text x="994" y="322" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">nosuid,noexec</text><rect x="40" y="378" width="1200" height="120" rx="14" fill="#121a30" stroke="#b58cff" stroke-width="1.8" opacity="1" /><rect x="40" y="378" width="200" height="120" rx="14" fill="#b58cff" opacity="0.2" /><text x="60" y="412" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="21" font-weight="800" fill="#b58cff" text-anchor="start" opacity="1">GATE</text><text x="60" y="438" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#8fa0c8" text-anchor="start" opacity="1">12 guest checks</text><text x="264" y="412" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">Find the guest root and read it with the chroot-style reader</text><text x="264" y="436" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">(a guest symlink can never reach the host), then run the 12 checks.</text><text x="264" y="462" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="16" font-weight="700" fill="#35d07f" text-anchor="start" opacity="1">GREEN or YELLOW: carry on, with the caveats printed.</text><rect x="880" y="396" width="340" height="84" rx="10" fill="#0b1020" stroke="#ff5d6c" stroke-width="1.8" opacity="1" /><text x="896" y="424" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="17" font-weight="800" fill="#ff5d6c" text-anchor="start" opacity="1">RED  →  refuse</text><text x="896" y="448" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">tear down, restart the VM,</text><text x="896" y="466" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">exit 77. Nothing is kept.</text><rect x="40" y="516" width="1200" height="150" rx="14" fill="#121a30" stroke="#35d07f" stroke-width="1.8" opacity="1" /><rect x="40" y="516" width="200" height="150" rx="14" fill="#35d07f" opacity="0.2" /><text x="60" y="550" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="21" font-weight="800" fill="#35d07f" text-anchor="start" opacity="1">PHASE B</text><text x="60" y="576" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#8fa0c8" text-anchor="start" opacity="1">build the container</text><text x="60" y="595" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#8fa0c8" text-anchor="start" opacity="1">(decided from the guest)</text><rect x="256" y="532" width="186" height="118" rx="10" fill="#0b1020" stroke="#35d07f" stroke-width="1.6" opacity="1" /><text x="268" y="558" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15.5" font-weight="800" fill="#35d07f" text-anchor="start" opacity="1">tar-create</text><text x="268" y="580" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">archive the</text><text x="268" y="597" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">guest FS with</text><text x="268" y="614" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">owners, xattrs,</text><text x="268" y="631" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">ACLs</text><rect x="453" y="532" width="186" height="118" rx="10" fill="#0b1020" stroke="#35d07f" stroke-width="1.6" opacity="1" /><text x="465" y="558" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15.5" font-weight="800" fill="#35d07f" text-anchor="start" opacity="1">ct-create</text><text x="465" y="580" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">pct create:</text><text x="465" y="597" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">unprivileged,</text><text x="465" y="614" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">VM's MAC, tagged,</text><text x="465" y="631" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">stopped</text><rect x="650" y="532" width="186" height="118" rx="10" fill="#0b1020" stroke="#35d07f" stroke-width="1.6" opacity="1" /><text x="662" y="558" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15.5" font-weight="800" fill="#35d07f" text-anchor="start" opacity="1">ct-fixup</text><text x="662" y="580" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">fstab, cloud-</text><text x="662" y="597" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">init, netplan,</text><text x="662" y="614" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">console, kernel</text><text x="662" y="631" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">mounts (copy only)</text><rect x="847" y="532" width="186" height="118" rx="10" fill="#0b1020" stroke="#35d07f" stroke-width="1.6" opacity="1" /><text x="859" y="558" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15.5" font-weight="800" fill="#35d07f" text-anchor="start" opacity="1">ct-copy</text><text x="859" y="580" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">extra disks into</text><text x="859" y="597" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">their mount</text><text x="859" y="614" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">points (verified)</text><rect x="1044" y="532" width="186" height="118" rx="10" fill="#0b1020" stroke="#35d07f" stroke-width="1.6" opacity="1" /><text x="1056" y="558" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15.5" font-weight="800" fill="#35d07f" text-anchor="start" opacity="1">ct-start</text><text x="1056" y="580" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">only with</text><text x="1056" y="597" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">--start</text><text x="1056" y="614" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">(the cutover)</text><rect x="40" y="684" width="1200" height="92" rx="14" fill="#121a30" stroke="#4fd1e8" stroke-width="1.8" opacity="1" /><rect x="40" y="684" width="200" height="92" rx="14" fill="#4fd1e8" opacity="0.2" /><text x="60" y="718" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="21" font-weight="800" fill="#4fd1e8" text-anchor="start" opacity="1">COMMIT</text><text x="60" y="744" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#8fa0c8" text-anchor="start" opacity="1">then clean up</text><text x="264" y="718" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">Container, VM's stopped state and onboot flag are marked KEPT; the journal says COMMITTED.</text><text x="264" y="744" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="16" font-weight="400" fill="#dbe4ff" text-anchor="start" opacity="1">Everything else (snapshot, loop device, mounts, staged archives) is undone, newest first.</text><rect x="40" y="792" width="1200" height="48" rx="12" fill="#0b1020" stroke="#ff5d6c" stroke-width="1.8" stroke-dasharray="8 6" opacity="1" /><text x="640" y="822" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="16" font-weight="700" fill="#ff5d6c" text-anchor="middle" opacity="1">At ANY point: an error, Ctrl-C, SIGTERM or a dropped ssh session  →  the journal tears it all down and restarts the VM</text></svg>
